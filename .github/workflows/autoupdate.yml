name: CI

on:
  schedule:
    - cron: "30 2 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  unciv-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download oxipng
        shell: bash
        run: |
          set -e

          OXIPNG_URL=$(curl -fsSL \
            https://api.github.com/repos/shssoichiro/oxipng/releases/latest \
            | jq -r '.assets[]
              | select(.name | test("x86_64.*linux.*tar.gz$"))
              | .browser_download_url' \
            | head -n 1)

          if [ -z "$OXIPNG_URL" ] || [ "$OXIPNG_URL" = "null" ]; then
            echo "ERROR: oxipng release not found."
            exit 1
          fi

          echo "Downloading oxipng..."
          wget -q -O oxipng.tar.gz "$OXIPNG_URL"

          tar -xzf oxipng.tar.gz

          OXIPNG=$(find . -type f -name "oxipng" -perm -111 | head -n 1)

          if [ -z "$OXIPNG" ]; then
            echo "ERROR: oxipng executable not found."
            exit 1
          fi

          chmod +x "$OXIPNG"

          echo "OXIPNG=$OXIPNG" >> "$GITHUB_ENV"

          echo "oxipng ready: $OXIPNG"

      - name: Compress PNG images
        shell: bash
        run: |
          set -e

          if [ ! -d "Images" ]; then
            echo "Images directory not found."
            exit 1
          fi

          PNG_COUNT=$(find Images -type f -iname "*.png" | wc -l)

          echo "Found $PNG_COUNT PNG image(s)."

          if [ "$PNG_COUNT" -eq 0 ]; then
            echo "No PNG files found."
            exit 0
          fi

          find Images -type f -iname "*.png" \
            -exec "$OXIPNG" -o 4 --strip safe {} +

          echo "PNG compression completed."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download Unciv
        shell: bash
        run: |
          set -e

          UNCIV_URL=$(curl -fsSL \
            https://api.github.com/repos/yairm210/Unciv/releases/latest \
            | jq -r '.assets[]
              | select(.name == "Unciv.jar")
              | .browser_download_url' \
            | head -n 1)

          if [ -z "$UNCIV_URL" ] || [ "$UNCIV_URL" = "null" ]; then
            echo "ERROR: Unciv.jar not found."
            exit 1
          fi

          echo "Downloading latest Unciv.jar..."
          wget -q -O Unciv.jar "$UNCIV_URL"

          if [ ! -s "Unciv.jar" ]; then
            echo "ERROR: Unciv.jar download failed."
            exit 1
          fi

      - name: Run Unciv mod-ci
        shell: bash
        run: |
          set -e

          java -jar Unciv.jar mod-ci

      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          rm -f Unciv.jar
          rm -f oxipng.tar.gz

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Autoupdate"
          title: "Autoupdate Unciv mod"
          body: |
            Automatically update the Unciv mod.

            This pull request was generated by GitHub Actions.
          branch: autoupdate
          delete-branch: true
