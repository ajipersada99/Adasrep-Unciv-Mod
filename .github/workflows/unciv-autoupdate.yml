name: Build Unciv Atlas

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-atlas
  cancel-in-progress: true

jobs:
  build-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Unciv 4.22.1
        shell: bash
        run: |
          set -euo pipefail

          URL="$(
            curl -fsSL --retry 3 --retry-delay 2 \
              https://api.github.com/repos/yairm210/Unciv/releases/tags/4.22.1 \
            | jq -r '
              .assets[]
              | select(.name == "Unciv.jar")
              | .browser_download_url
            ' \
            | head -n 1
          )"

          test -n "$URL"
          test "$URL" != "null"

          curl -fL --retry 3 --retry-delay 2 \
            "$URL" \
            -o Unciv.jar

          test -s Unciv.jar

      - name: Show Unciv version
        shell: bash
        run: |
          set -euo pipefail
          java -jar Unciv.jar --version || true

      - name: Check source unit icons
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking source PNG files..."

          test -f "Images/UnitIcons/Pengintai Elit.png"
          test -f "Images/UnitIcons/Pemanah Beruntun.png"
          test -f "Images/UnitIcons/Prabu.png"

          echo "Found:"
          echo "- Images/UnitIcons/Pengintai Elit.png"
          echo "- Images/UnitIcons/Pemanah Beruntun.png"
          echo "- Images/UnitIcons/Prabu.png"

      - name: Pack Unciv texture atlas
        shell: bash
        run: |
          set -euo pipefail

          echo "Running Unciv mod-ci..."

          java -jar Unciv.jar mod-ci

          echo "Generated files:"
          ls -lh game.atlas game.png

      - name: Verify generated atlas
        shell: bash
        run: |
          set -euo pipefail

          test -f "game.atlas"
          test -f "game.png"

          echo "Searching game.atlas..."

          echo ""
          echo "Pengintai Elit:"
          grep -F "UnitIcons/Pengintai Elit" game.atlas || true

          echo ""
          echo "Pemanah Beruntun:"
          grep -F "UnitIcons/Pemanah Beruntun" game.atlas || true

          echo ""
          echo "Prabu:"
          grep -F "UnitIcons/Prabu" game.atlas || true

          echo ""
          echo "========================================"

          if grep -Fq "UnitIcons/Pengintai Elit" game.atlas; then
            echo "OK: Pengintai Elit masuk game.atlas."
          else
            echo "ERROR: Pengintai Elit TIDAK masuk game.atlas!"
            echo ""
            echo "Isi UnitIcons yang ditemukan:"
            grep -F "UnitIcons/" game.atlas || true
            exit 1
          fi

          if grep -Fq "UnitIcons/Pemanah Beruntun" game.atlas; then
            echo "OK: Pemanah Beruntun masuk game.atlas."
          else
            echo "ERROR: Pemanah Beruntun TIDAK masuk game.atlas!"
            exit 1
          fi

          if grep -Fq "UnitIcons/Prabu" game.atlas; then
            echo "OK: Prabu masuk game.atlas."
          else
            echo "ERROR: Prabu TIDAK masuk game.atlas!"
            exit 1
          fi

          echo "========================================"
          echo "SEMUA ICON BERHASIL DIVERIFIKASI."

      - name: Show atlas information
        shell: bash
        run: |
          echo "game.atlas:"
          ls -lh game.atlas

          echo ""
          echo "game.png:"
          ls -lh game.png

          echo ""
          echo "Atlases.json:"
          if [ -f "Atlases.json" ]; then
            cat Atlases.json
          else
            echo "Tidak ada Atlases.json"
          fi

      - name: Commit generated atlas
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add game.atlas game.png Atlases.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan atlas."
            exit 0
          fi

          git commit -m "Update Unciv texture atlas [skip ci]"
          git push origin HEAD:main

      - name: Cleanup
        if: always()
        run: |
          rm -f Unciv.jar
