name: Build Unciv Atlas

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-atlas
  cancel-in-progress: true

jobs:
  build-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Unciv 4.22.1
        shell: bash
        run: |
          set -euo pipefail

          UNCIV_URL="$(
            curl -fsSL --retry 3 --retry-delay 2 \
              https://api.github.com/repos/yairm210/Unciv/releases/tags/4.22.1 \
            | jq -r '
              .assets[]
              | select(.name == "Unciv.jar")
              | .browser_download_url
            ' \
            | head -n 1
          )"

          if [ -z "$UNCIV_URL" ] || [ "$UNCIV_URL" = "null" ]; then
            echo "::error::Unciv 4.22.1 tidak ditemukan."
            exit 1
          fi

          curl -fL --retry 3 --retry-delay 2 \
            "$UNCIV_URL" \
            -o Unciv.jar

          test -s Unciv.jar

      - name: Verify source files
        shell: bash
        run: |
          set -euo pipefail

          echo "Memeriksa file sumber..."

          test -f "Images/UnitIcons/Pengintai Elit.png"
          test -f "Images/UnitIcons/Pemanah Beruntun.png"
          test -f "Images/UnitIcons/Prabu.png"

          echo "Semua file PNG ditemukan."

          echo ""
          echo "Pengintai Elit:"
          file "Images/UnitIcons/Pengintai Elit.png"

      - name: Normalize Pengintai Elit PNG
        shell: bash
        run: |
          set -euo pipefail

          echo "Menormalkan PNG Pengintai Elit..."

          mkdir -p "$RUNNER_TEMP/pengintai"

          cp "Images/UnitIcons/Pengintai Elit.png" \
             "$RUNNER_TEMP/pengintai/source.png"

          convert \
            "$RUNNER_TEMP/pengintai/source.png" \
            -background none \
            -alpha on \
            PNG32:"Images/UnitIcons/Pengintai Elit.png"

          echo "PNG setelah normalisasi:"
          file "Images/UnitIcons/Pengintai Elit.png"

      - name: Install oxipng
        shell: bash
        run: |
          set -euo pipefail

          OXIPNG_URL="$(
            curl -fsSL --retry 3 --retry-delay 2 \
              https://api.github.com/repos/shssoichiro/oxipng/releases/latest \
            | jq -r '
              .assets[]
              | select(.name | test("x86_64-unknown-linux-gnu.tar.gz$"))
              | .browser_download_url
            ' \
            | head -n 1
          )"

          test -n "$OXIPNG_URL"
          test "$OXIPNG_URL" != "null"

          mkdir -p "$RUNNER_TEMP/oxipng"

          curl -fL --retry 3 --retry-delay 2 \
            "$OXIPNG_URL" \
            -o "$RUNNER_TEMP/oxipng/oxipng.tar.gz"

          tar -xzf "$RUNNER_TEMP/oxipng/oxipng.tar.gz" \
            -C "$RUNNER_TEMP/oxipng"

          OXIPNG_BIN="$(
            find "$RUNNER_TEMP/oxipng" \
              -type f \
              -name oxipng \
              | head -n 1
          )"

          test -n "$OXIPNG_BIN"

          chmod +x "$OXIPNG_BIN"

          echo "OXIPNG_BIN=$OXIPNG_BIN" >> "$GITHUB_ENV"

      - name: Compress images
        shell: bash
        run: |
          set -euo pipefail

          find Images \
            -type f \
            -iname "*.png" \
            -print0 \
          | xargs -0 -r "$OXIPNG_BIN" \
            --opt max \
            --strip all

      - name: Remove old atlas before rebuilding
        shell: bash
        run: |
          set -euo pipefail

          echo "Menghapus atlas lama..."

          rm -f game.atlas
          rm -f game.png

          echo "Atlas lama sudah dihapus."

      - name: Pack Unciv texture atlas
        shell: bash
        run: |
          set -euo pipefail

          echo "Menjalankan Unciv 4.22.1 mod-ci..."

          java -jar Unciv.jar mod-ci

          echo ""
          echo "File hasil packing:"

          test -f game.atlas
          test -f game.png

          ls -lh game.atlas
          ls -lh game.png

      - name: Verify Pengintai Elit
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "MEMERIKSA PENGINTAI ELIT"
          echo "========================================"

          if grep -Fq "UnitIcons/Pengintai Elit" game.atlas; then
            echo "OK: UnitIcons/Pengintai Elit ditemukan."
          else
            echo "ERROR: UnitIcons/Pengintai Elit TIDAK ditemukan!"
            echo ""
            echo "Semua UnitIcons yang ada:"
            grep -F "UnitIcons/" game.atlas || true
            exit 1
          fi

      - name: Verify all Adasrep unit icons
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq "UnitIcons/Pengintai Elit" game.atlas
          grep -Fq "UnitIcons/Pemanah Beruntun" game.atlas
          grep -Fq "UnitIcons/Prabu" game.atlas

          echo ""
          echo "========================================"
          echo "SEMUA ICON ADASREP DITEMUKAN"
          echo "========================================"

          echo "UnitIcons/Pengintai Elit"
          echo "UnitIcons/Pemanah Beruntun"
          echo "UnitIcons/Prabu"

      - name: Show atlas information
        shell: bash
        run: |
          echo "=== game.atlas ==="
          ls -lh game.atlas

          echo ""
          echo "=== game.png ==="
          ls -lh game.png

          echo ""
          echo "=== UnitIcons ==="
          grep -F "UnitIcons/" game.atlas || true

      - name: Commit generated atlas
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            game.atlas \
            game.png \
            Atlases.json \
            "Images/UnitIcons/Pengintai Elit.png"

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Rebuild Unciv atlas"

          git push origin HEAD:main

      - name: Remove Unciv
        if: always()
        shell: bash
        run: |
          rm -f Unciv.jar
