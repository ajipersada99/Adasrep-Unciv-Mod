name: Build Unciv Atlas

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unciv-atlas
  cancel-in-progress: true

jobs:
  build-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Unciv 4.22.0
        shell: bash
        run: |
          set -euo pipefail

          UNCIV_URL="$(
            curl -fsSL --retry 3 --retry-delay 2 \
              https://api.github.com/repos/yairm210/Unciv/releases/tags/4.22.0 \
            | jq -r '
              .assets[]
              | select(.name == "Unciv.jar")
              | .browser_download_url
            ' \
            | head -n 1
          )"

          if [ -z "$UNCIV_URL" ] || [ "$UNCIV_URL" = "null" ]; then
            echo "::error::Unciv.jar 4.22.0 tidak ditemukan."
            exit 1
          fi

          curl -fL --retry 3 --retry-delay 2 \
            "$UNCIV_URL" \
            -o Unciv.jar

          test -s Unciv.jar

      - name: Show Unciv version
        shell: bash
        run: |
          set -euo pipefail
          java -jar Unciv.jar --version || true

      - name: Pack Unciv texture atlas
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "Images" ]; then
            echo "::error::Folder Images tidak ditemukan."
            exit 1
          fi

          echo "Packing Images menjadi game.atlas dan game.png..."

          java -jar Unciv.jar mod-ci

      - name: Verify generated atlas
        shell: bash
        run: |
          set -euo pipefail

          echo "Memeriksa hasil atlas..."

          if [ ! -f "game.atlas" ]; then
            echo "::error::game.atlas TIDAK dibuat."
            exit 1
          fi

          if [ ! -f "game.png" ]; then
            echo "::error::game.png TIDAK dibuat."
            exit 1
          fi

          echo "game.atlas ditemukan:"
          ls -lh game.atlas

          echo "game.png ditemukan:"
          ls -lh game.png

      - name: Verify Pengintai Elit icon
        shell: bash
        run: |
          set -euo pipefail

          echo "Memeriksa UnitIcons/Pengintai Elit..."

          if ! grep -Fq "UnitIcons/Pengintai Elit" game.atlas; then
            echo "::error::Pengintai Elit TIDAK masuk ke game.atlas!"
            echo ""
            echo "Isi UnitIcons yang ditemukan:"
            grep -F "UnitIcons/" game.atlas || true
            exit 1
          fi

          echo "========================================"
          echo "BERHASIL:"
          echo "UnitIcons/Pengintai Elit ditemukan!"
          echo "========================================"

      - name: Verify other Adasrep unit icons
        shell: bash
        run: |
          set -euo pipefail

          for ICON in \
            "UnitIcons/Pemanah Beruntun" \
            "UnitIcons/Prabu"
          do
            echo "Checking $ICON..."

            if ! grep -Fq "$ICON" game.atlas; then
              echo "::error::$ICON tidak ditemukan di game.atlas!"
              exit 1
            fi

            echo "OK: $ICON"
          done

      - name: Show atlas information
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "ATLAS BERHASIL DIBUAT"
          echo "========================================"

          echo ""
          echo "Files:"
          ls -lh game.atlas game.png

          echo ""
          echo "Pengintai Elit:"
          grep -A8 -B1 -F "UnitIcons/Pengintai Elit" game.atlas

          echo ""
          echo "Git status:"
          git status --short

      - name: Remove Unciv
        if: always()
        shell: bash
        run: |
          rm -f Unciv.jar

      - name: Commit atlas to main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add game.atlas game.png Atlases.json

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan atlas."
            exit 0
          fi

          git commit -m "Update Unciv texture atlas [skip ci]"
          git push origin main
