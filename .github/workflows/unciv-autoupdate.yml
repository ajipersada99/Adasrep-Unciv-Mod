name: Unciv Autoupdate

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: unciv-autoupdate
  cancel-in-progress: true

jobs:
  unciv-autoupdate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install oxipng
        shell: bash
        run: |
          set -euo pipefail

          OXIPNG_URL="$(
            curl -fsSL --retry 3 --retry-delay 2               -H "Accept: application/vnd.github+json"               https://api.github.com/repos/shssoichiro/oxipng/releases/latest |
            jq -r '.assets[] | select(.name | test("x86_64-unknown-linux-gnu\\.tar\\.gz$")) | .browser_download_url' |
            head -n 1
          )"

          if [ -z "$OXIPNG_URL" ] || [ "$OXIPNG_URL" = "null" ]; then
            echo "::error::Could not find the Linux x86_64 oxipng release."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/oxipng"
          curl -fL --retry 3 --retry-delay 2 "$OXIPNG_URL" -o "$RUNNER_TEMP/oxipng/oxipng.tar.gz"
          tar -xzf "$RUNNER_TEMP/oxipng/oxipng.tar.gz" -C "$RUNNER_TEMP/oxipng"

          OXIPNG_BIN="$(find "$RUNNER_TEMP/oxipng" -type f -name oxipng -print -quit)"

          if [ -z "$OXIPNG_BIN" ]; then
            echo "::error::oxipng executable was not found."
            exit 1
          fi

          chmod +x "$OXIPNG_BIN"
          echo "OXIPNG_BIN=$OXIPNG_BIN" >> "$GITHUB_ENV"

      - name: Compress PNG images
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "Images" ]; then
            echo "::error::Images directory was not found."
            exit 1
          fi

          find Images -type f -iname "*.png" -print0 |
            xargs -0 -r "$OXIPNG_BIN" --opt max --strip all --alpha

      - name: Download latest Unciv.jar
        shell: bash
        run: |
          set -euo pipefail

          UNCIV_URL="$(
            curl -fsSL --retry 3 --retry-delay 2               -H "Accept: application/vnd.github+json"               https://api.github.com/repos/yairm210/Unciv/releases/latest |
            jq -r '.assets[] | select(.name == "Unciv.jar") | .browser_download_url' |
            head -n 1
          )"

          if [ -z "$UNCIV_URL" ] || [ "$UNCIV_URL" = "null" ]; then
            echo "::error::Unciv.jar was not found in the latest Unciv release."
            exit 1
          fi

          curl -fL --retry 3 --retry-delay 2 "$UNCIV_URL" -o Unciv.jar
          test -s Unciv.jar

      - name: Run Unciv mod-ci
        continue-on-error: true
        shell: bash
        run: |
          java -jar Unciv.jar mod-ci

      - name: Remove Unciv executable
        if: always()
        shell: bash
        run: rm -f Unciv.jar

      - name: Create Pull Request
        if: always()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: unciv-autoupdate
          delete-branch: true
          commit-message: "Autoupdate"
          title: "Autoupdate Unciv mod"
          body: |
            Automated Unciv mod update.
            This workflow downloads the latest Unciv release and runs mod-ci.
