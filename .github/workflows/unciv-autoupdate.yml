name: build-atlas

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-atlas
  cancel-in-progress: true

jobs:
  build-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      # ==========================================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. JAVA 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 3. DOWNLOAD UNCIV 4.22.1
      # ==========================================================
      - name: Download Unciv 4.22.1
        run: |
          set -e

          echo "Downloading Unciv 4.22.1..."

          wget -q \
            -O Unciv.jar \
            "https://github.com/yairm210/Unciv/releases/download/4.22.1/Unciv.jar"

          test -s Unciv.jar

          echo "Unciv berhasil di-download:"
          ls -lh Unciv.jar

      # ==========================================================
      # 4. VERIFY SOURCE FILES
      # ==========================================================
      - name: Verify source files
        run: |
          set -e

          echo "=========================================="
          echo "CEK UNIT ICONS"
          echo "=========================================="

          test -d Images/UnitIcons

          find Images/UnitIcons \
            -maxdepth 1 \
            -type f \
            -print

          echo
          echo "=========================================="
          echo "CEK PENGINTAI ELIT"
          echo "=========================================="

          test -f "Images/UnitIcons/Pengintai Elit.png"

          echo "OK: Pengintai Elit.png ditemukan."

          echo
          echo "=========================================="
          echo "CEK PEMANAH BERUNTUN"
          echo "=========================================="

          test -f "Images/UnitIcons/Pemanah Beruntun.png"

          echo "OK: Pemanah Beruntun.png ditemukan."

          echo
          echo "=========================================="
          echo "CEK PRABU"
          echo "=========================================="

          test -f "Images/UnitIcons/Prabu.png"

          echo "OK: Prabu.png ditemukan."

          echo
          echo "=========================================="
          echo "NAMA FILE YANG DILACAK GIT"
          echo "=========================================="

          git ls-files | grep -F "Images/UnitIcons/"

      # ==========================================================
      # 5. INSTALL IMAGEMAGICK
      # ==========================================================
      - name: Install ImageMagick
        run: |
          set -e

          echo "Installing ImageMagick..."

          sudo apt-get update
          sudo apt-get install -y imagemagick

          echo
          echo "ImageMagick version:"
          convert --version

      # ==========================================================
      # 6. NORMALIZE PENGINTAI ELIT PNG
      # ==========================================================
      - name: Normalize Pengintai Elit PNG
        run: |
          set -e

          echo "Menormalkan PNG Pengintai Elit..."

          convert \
            "Images/UnitIcons/Pengintai Elit.png" \
            -strip \
            -define png:color-type=6 \
            "Images/UnitIcons/Pengintai Elit.normalized.png"

          mv \
            "Images/UnitIcons/Pengintai Elit.normalized.png" \
            "Images/UnitIcons/Pengintai Elit.png"

          echo
          echo "PNG berhasil dinormalisasi."

          echo
          echo "Informasi PNG:"
          file "Images/UnitIcons/Pengintai Elit.png"

          identify "Images/UnitIcons/Pengintai Elit.png"

      # ==========================================================
      # 7. INSPECT SEMUA ICON ADASREP
      # ==========================================================
      - name: Inspect Adasrep unit icons
        run: |
          set -
