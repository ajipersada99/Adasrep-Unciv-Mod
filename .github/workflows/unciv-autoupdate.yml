name: Unciv Autoupdate

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  unciv-autoupdate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Unciv
        shell: bash
        run: |
          set -e

          URL=$(curl -fsSL \
            https://api.github.com/repos/yairm210/Unciv/releases/latest \
            | jq -r '.assets[] | select(.name == "Unciv.jar") | .browser_download_url' \
            | head -n 1)

          test -n "$URL"
          test "$URL" != "null"

          curl -fL "$URL" -o Unciv.jar

      - name: Run Unciv mod-ci
        shell: bash
        run: |
          set -e
          java -jar Unciv.jar mod-ci

      - name: Remove Unciv
        if: always()
        run: rm -f Unciv.jar

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Autoupdate
          title: "Autoupdate Unciv mod"
          body: "Automatically update the Unciv mod."
          branch: autoupdate
